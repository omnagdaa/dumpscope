name: Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu: a build runs on this glibc or newer.
          - { os: ubuntu-22.04, name: linux-x86_64 }
          - { os: windows-latest, name: windows-x86_64 }
          - { os: macos-latest, name: macos-arm64 }
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libxcb-cursor0 desktop-file-utils
      - run: uv sync --locked --group package
      - run: uv run pytest -q
      - run: uv run pyinstaller --noconfirm packaging/dumpscope.spec

      - name: Smoke test the package
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) app=dist/DumpScope.app/Contents/MacOS/dumpscope ;;
            *) app=dist/dumpscope/dumpscope ;;
          esac
          "$app" --vol3-cli --help | grep -q "usage: vol"
          "$app" --vol3-introspect | grep -q "windows.pslist.PsList"
          python3 -c "
          import subprocess, sys
          try:
              subprocess.run(sys.argv[1:], timeout=10, check=True)
          except subprocess.TimeoutExpired:
              pass  # still running after 10 seconds: the window opened
          " "$app" --analysis

      - name: Archive
        shell: bash
        run: |
          mkdir -p out
          case "$RUNNER_OS" in
            Linux)
              curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
              chmod +x appimagetool
              packaging/build-appimage.sh ./appimagetool
              APPIMAGE_EXTRACT_AND_RUN=1 dist/DumpScope-x86_64.AppImage --vol3-cli --help | grep -q "usage: vol"
              mv dist/DumpScope-x86_64.AppImage out/
              ;;
            Windows) (cd dist && 7z a -bd "../out/DumpScope-${{ matrix.name }}.zip" dumpscope) ;;
            macOS) ditto -c -k --keepParent dist/DumpScope.app "out/DumpScope-${{ matrix.name }}.zip" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: DumpScope-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" out/* --generate-notes --draft --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
